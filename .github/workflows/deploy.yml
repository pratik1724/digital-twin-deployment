name: Deploy to EC2 (Self-Hosted)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Print runner info
        run: |
          echo "Running on self-hosted runner on EC2"
          pwd
          whoami

      - name: Checkout (not used directly)
        uses: actions/checkout@v4

      - name: Pull latest code into /home/ubuntu/digital-twin-deployment
        run: |
          cd /home/ubuntu/digital-twin-deployment
          git fetch origin main
          git reset --hard origin/main

      - name: Create/Update backend .env
        run: |
          cd /home/ubuntu/digital-twin-deployment/backend
          cat > .env << 'EOF'
MONGO_URL=${{ secrets.MONGO_URL }}
DB_NAME=${{ secrets.DB_NAME }}
EOF

      - name: Install backend dependencies
        run: |
          cd /home/ubuntu/digital-twin-deployment/backend
          if [ ! -d venv ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create/Update frontend .env
        run: |
          cd /home/ubuntu/digital-twin-deployment/frontend
          cat > .env << 'EOF'
REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
EOF

      - name: Install frontend dependencies and build
        run: |
          cd /home/ubuntu/digital-twin-deployment/frontend
          if command -v yarn >/dev/null 2>&1; then
            yarn install --frozen-lockfile || yarn install
            yarn build
          else
            npm install
            npm run build
          fi

      - name: Restart services
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart digital_twin_backend.service
          sudo systemctl restart digital_twin_frontend.service

      - name: Check backend health
        run: |
          curl -f http://127.0.0.1:8001/api/health
